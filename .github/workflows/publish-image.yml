name: Publish Vision image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      base_image:
        description: "승인된 Python 3.12/PyTorch base image 또는 digest"
        required: false
        type: string

# 모든 job의 기본 권한은 source checkout용 읽기 전용이다.
permissions:
  contents: read

concurrency:
  group: publish-vision-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and Git-managed models
        uses: actions/checkout@v6

      # hosted runner에는 torch/Ultralytics를 설치하지 않고 경량 API 계약만 검증한다.
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-common.txt
            requirements-dev.txt

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-common.txt -r requirements-dev.txt

      - name: Verify model size and SHA-256
        run: python scripts/verify_runtime_models.py

      - name: Run all core tests
        run: python -m pytest -q

  publish:
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # private GHCR 쓰기 권한은 테스트를 통과한 publish job에만 추가한다.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source and Git-managed models
        uses: actions/checkout@v6

      # 수동 입력을 우선하고, 없으면 저장소 변수 VISION_BASE_IMAGE를 사용한다.
      # base image가 확정되지 않은 상태에서 우연히 배포 이미지를 만들지 않는다.
      - name: Resolve image configuration
        id: config
        shell: bash
        env:
          DISPATCH_BASE_IMAGE: ${{ github.event.inputs.base_image }}
          REPOSITORY_BASE_IMAGE: ${{ vars.VISION_BASE_IMAGE }}
        run: |
          base_image="${DISPATCH_BASE_IMAGE:-${REPOSITORY_BASE_IMAGE}}"
          if [[ -z "${base_image}" ]]; then
            echo "::error::Set repository variable VISION_BASE_IMAGE or workflow input base_image."
            exit 1
          fi
          echo "base_image=${base_image}" >> "${GITHUB_OUTPUT}"
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Verify model size and SHA-256
        run: python3 scripts/verify_runtime_models.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create immutable and human-readable tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.config.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish private GHCR image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.config.outputs.base_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
